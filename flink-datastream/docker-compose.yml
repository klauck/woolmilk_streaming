services:
  jobmanager:
    build: .
    image: woolmilk-flink-ds:1.20.0
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./:/opt/flink-datastream

  taskmanager:
    build: .
    image: woolmilk-flink-ds:1.20.0
    depends_on:
      - jobmanager
    command: taskmanager
    deploy:
      replicas: 3
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
    volumes:
      - ./:/opt/flink-datastream
